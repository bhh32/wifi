[package]
name = "cmd_lib"
version = "0.3.0"
edition = "2021"
authors = ["Bryan Hyland <bryan.hyland32@gmail.com>"]
description = "Core library for managing network connections via Linux NetworkManager (nmcli)."

[dependencies]
thiserror = "1"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "rt"], optional = true }

[features]
default = []
async = ["tokio"]
